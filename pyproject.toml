[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pateda"
dynamic = ["version"]
description = "Python Algorithms for Estimation of Distribution Algorithms"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Roberto Santana", email = "roberto.santana@ehu.eus" },
]
keywords = [
    "estimation of distribution algorithms", "EDA", "evolutionary computation",
    "probabilistic models", "optimization", "combinatorial optimization",
    "Bayesian networks", "Gaussian models",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "networkx>=3.0",  # knowledge_extraction.network_measures uses louvain/triadic census
    "scikit-learn>=1.0",
    "matplotlib>=3.4",
    "seaborn>=0.11",
    # Bayesian-network EDAs (BOA, EBNA) delegate structure/parameter learning
    # and sampling to the bayes_nets library (replaces the former pgmpy use).
    # pateda 0.2.0 uses the expanded structure-learning API of bayes_nets 0.2.0
    # (fit(method=...) with the full set of learners); require that version.
    "bayes_nets>=0.2.0",
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
copula = ["pyvinecopulib>=0.6"]
dev = [
    "pytest>=7",
    "pytest-cov>=3",
    "black>=22",
    "mypy>=0.950",
    "ruff>=0.1",
]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme>=1",
    "myst-parser>=2",
]
all = ["pateda[copula,dev,docs]"]

[project.urls]
Homepage = "https://github.com/rsantana-isg/pateda"
Repository = "https://github.com/rsantana-isg/pateda"
Issues = "https://github.com/rsantana-isg/pateda/issues"

# Single-source the version: read __version__ from src/pateda/__init__.py so the
# only place you bump a release number is that file.
[tool.setuptools.dynamic]
version = { attr = "pateda.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Benchmark instance files shipped inside the wheel.  ``.clq``/``.col``/``.mis``
# are graph-instance formats (MaxClique and graph-colouring problems); ``.npz``
# holds precomputed instance arrays.  Without these, e.g. MaxClique_* problems
# fail with FileNotFoundError on an installed pateda.
"pateda.functions" = [
    "**/*.mat", "**/*.cnf", "**/*.dat", "**/*.txt",
    "**/*.clq", "**/*.col", "**/*.mis", "**/*.npz",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 99
target-version = "py39"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
ignore_missing_imports = true
